<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet</title>
<meta name="theme-color" content="#FCF6EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:Nunito;font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";font-weight:600;font-display:swap;src:url(fonts/dancing-script-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";font-weight:700;font-display:swap;src:url(fonts/dancing-script-latin-700-normal.woff2) format("woff2")}
/* Concept : un carnet aquarelle (bullet journal). Chaque mois a sa palette, son illustration de haut de page et deux illustrations peintes. Thème clair unique, assumé. */
:root{
  --paper:#FCF6EA; --dot:rgba(160,120,50,.16); --ink:#A0702A; --ink-soft:#8A6630; --band:#F8E8C6; --line:#E9D4AA; --glow:#FBE2A8; --wash:#F4D59C;
  --text:#3A2A1E; --muted:#6E5A48; --card:rgba(255,253,248,.94);
  --f-hand:"Dancing Script", "Segoe Script", cursive;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html,body{background:var(--paper);color:var(--text)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#paper{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);background-size:20px 20px}
#drift{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:2;max-width:560px;min-height:100vh;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));overflow:hidden}
.wash{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--text)}
h2{font-family:var(--f-hand);font-weight:700;font-size:38px;line-height:1;color:var(--ink)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.stk{position:absolute;pointer-events:none}

/* Écran de connexion */
#gate{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--paper);background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);background-size:20px 20px}
#gate[hidden]{display:none}
#gate h1{font-family:var(--f-hand);font-weight:700;font-size:58px;line-height:1;color:var(--ink)}
#gate p{color:var(--muted);max-width:300px}
#gate .btn-ink{min-height:50px;padding:12px 22px;font-size:16px;display:flex;align-items:center;gap:10px}
body.locked #app,body.locked nav.tabs{visibility:hidden}
.gcal-btn{margin:8px 12px 4px;display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);min-height:44px;border-radius:6px;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);font-size:14px;font-weight:800}

/* Haut de page */
.hd{position:relative;container-type:inline-size;height:73.4cqw}
.hd-img{position:absolute;left:-5.64cqw;top:0;width:111.3cqw;max-width:none;height:62.1cqw;object-fit:cover;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
.hd-title{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.hd-title .halo{position:absolute;left:-26px;right:-26px;top:-16px;bottom:-18px;z-index:-1;border-radius:50%}
.mname{font-family:var(--f-hand);font-weight:700;line-height:1;color:var(--ink)}
.garland{display:flex;align-items:center;gap:6px;color:var(--ink);margin-top:2px}
.garland img{width:20px;height:20px}
.motto{margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.13em;line-height:1.5;text-transform:uppercase;color:var(--ink-soft)}
.hd-greet{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;padding:0 60px}
.hd-greet p{font-size:17px;font-weight:700;color:var(--text);text-align:center}
.gear{position:absolute;right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,253,248,.85);display:grid;place-items:center;color:var(--ink)}
.hd-greet .gear{bottom:-10px}
.hd.small{height:auto;padding:56px 0 6px}
.hd.small .hd-img{height:44cqw;opacity:.42;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);mask-image:linear-gradient(to bottom,#000 30%,transparent 100%)}
.hd.small .gear{top:14px}
.hd-page{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.hd-page h1{font-family:var(--f-hand);font-weight:700;font-size:54px;line-height:1.05;color:var(--ink)}
.hd-page .halo{position:absolute;left:12%;right:12%;top:-18px;bottom:-14px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,var(--paper) 60%,transparent 100%)}
.hero-sub{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink-soft);margin-top:4px}

/* Mouvement */
@keyframes fall{0%{transform:translate(0,-40px) rotate(0);opacity:0}6%{opacity:.9}30%{transform:translate(-40px,30vh) rotate(140deg)}60%{transform:translate(20px,62vh) rotate(300deg)}94%{opacity:.85}100%{transform:translate(-24px,108vh) rotate(520deg);opacity:0}}
@keyframes rain{0%{transform:translate(0,-30px);opacity:0}10%{opacity:.6}100%{transform:translate(-30px,108vh);opacity:.4}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(224,64,94,.45)}100%{box-shadow:0 0 0 12px rgba(224,64,94,0)}}
@keyframes inFromRight{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFromLeft{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.slide-next{animation:inFromRight .24s ease-out}
.slide-prev{animation:inFromLeft .24s ease-out}
.btn-mic{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:#FFFDF8;color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.btn-mic[hidden]{display:none}
.btn-mic.on{background:#FCE3E8;border-color:#E0405E;color:#B02848;animation:micPulse 1.2s ease-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.4}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-4px) rotate(var(--r,0deg))}}
.faller{position:absolute;top:0;animation:fall 18s linear infinite}
.faller.raindrop{animation-name:rain;animation-timing-function:linear}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.faller,.pulse,.bob,.bar i,.slide-next,.slide-prev,.btn-mic.on{animation:none!important}.faller{display:none}}

/* Bulles */
.bubbles-wrap{margin-top:18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bubbles-wrap::-webkit-scrollbar{display:none}
.bubbles{display:flex;gap:8px;width:max-content;padding-block:2px}
.bubble{display:flex;align-items:center;gap:6px;min-height:42px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,253,248,.85);font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.bubble .ct{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--band);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.bubble[aria-pressed="true"]{border-color:var(--ink);background:var(--band);color:var(--ink);font-weight:800}
.bubble[aria-pressed="true"] .ct{background:var(--ink);color:#FFFDF8}

/* Saisie */
.capture{position:relative;margin-top:16px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:18px;background:rgba(255,253,248,.92);border:1.5px solid var(--line);box-shadow:0 10px 24px rgba(90,60,30,.10)}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none;color:var(--text)}
.capture input::placeholder{color:#8A7A68}
.btn-add{width:44px;height:44px;border-radius:14px;border:0;background:var(--ink);display:grid;place-items:center;flex-shrink:0}
.btn-add[disabled]{opacity:.6}
.capture-hint{margin-top:8px;font-size:13px;color:var(--muted);padding-inline:6px}
.capture-hint:empty{display:none}
.capture-hint strong{color:var(--text)}

/* Cartes et sections */
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:6px;box-shadow:0 12px 28px rgba(90,60,30,.10)}
.section{position:relative;margin-top:38px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vine{color:var(--ink)}
.link-btn{border:0;background:none;padding:8px 0;font-size:14px;font-weight:800;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.soft-empty{padding:16px 18px;font-size:14px;color:var(--muted)}
.soft-empty b{color:var(--text)}
.solo>.section:first-child{margin-top:30px}

/* Briefing */
.brief-card{position:relative;margin-top:30px;padding:20px 20px 22px}
.brief-card.with-img{margin-top:84px}
.brief-head{display:flex;align-items:baseline;gap:10px}
.brief-head h2{font-size:34px}
.brief-head span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.brief{margin-top:12px;font-size:16px;line-height:1.55;color:var(--text)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--band);color:var(--ink)}
.brief-img{position:absolute;right:-14px;transform:rotate(3deg)}

/* Semaine */
.week{margin-top:12px;padding:4px 0}
.day{padding:0 12px 10px}
.dband{margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:3px 10px;border-radius:3px;background:var(--band)}
.dband span{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text);font-variant-numeric:tabular-nums}
.day.today .dband{background:var(--ink)}
.day.today .dband span{color:#FFFDF8}
.day.past .dband,.day.past .ev{opacity:.5}
.ev{display:flex;align-items:baseline;gap:8px;padding:7px 4px 0;flex-wrap:wrap}
.ev::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);flex-shrink:0;transform:translateY(-2px)}
.ev-t{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.ev-m{font-size:13px;color:var(--muted)}
.empty-day{display:flex;gap:6px;padding:9px 4px 0}
.empty-day i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.pill-todo{padding:4px 10px;border-radius:999px;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);font-size:12px;font-weight:800;min-height:32px}
.notice{padding:12px 14px;margin:8px 12px 4px;border-radius:4px;background:var(--band);font-size:13px;color:var(--text)}

/* Quête */
.quest{position:relative;padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px}
.quest-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.quest h3{font-size:17px;font-weight:800;margin-top:8px}
.quest h2{font-size:34px}
.quest .meta{font-size:13px;color:var(--muted);margin-top:2px}
.xp{flex-shrink:0;width:62px;height:62px;border-radius:50%;border:2px dashed var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--ink)}
.xp b{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1}
.xp span{font-size:10px;font-weight:800;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 12px;border:0;border-radius:4px;background:var(--band);text-align:left;font-size:15px;font-weight:800;color:var(--text)}
.box{width:20px;height:20px;border:2px solid var(--ink);border-radius:4px;background:#FFFDF8;flex-shrink:0;display:grid;place-items:center}
.step.done{background:transparent;color:var(--muted);text-decoration:line-through;font-weight:700}
.step.done .box{background:var(--ink)}
.later{display:flex;flex-direction:column;gap:8px}
.later div{display:flex;align-items:center;gap:12px;padding:0 12px;font-size:14px;color:var(--muted)}
.later div::before{content:"";width:16px;height:16px;border:1.5px solid var(--line);border-radius:3px;flex-shrink:0}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini{border:0;background:none;font-size:13px;font-weight:800;color:var(--muted);padding:8px 0;min-height:40px}
.qlist{display:flex;flex-direction:column;gap:22px;margin-top:12px}

/* Liens */
.frame{position:relative;margin-top:46px;padding:26px 22px 22px}
.frame>.c{position:absolute;width:34px;height:34px;border-color:var(--ink);border-style:solid;border-width:0}
.c.tl{left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}.c.tr{right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
.c.bl{left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}.c.br{right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}
.frame>h2{margin:-48px 0 0;text-align:center}
.frame>h2 span{padding:0 10px;background:var(--paper)}
.lrows{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.lrow{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--ink);flex-shrink:0}
.lrow .n{font-size:16px;font-weight:800}
.lrow .w{font-size:13px;color:var(--muted)}
.dotline{height:2px;background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:8px 2px}
.btn-line{min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:13px;font-weight:800;flex-shrink:0}
.btn-ink{min-height:44px;padding:9px 16px;border-radius:999px;border:0;background:var(--ink);color:#FFFDF8;font-size:14px;font-weight:800}

/* Anniversaires */
.bday{display:flex;align-items:center;gap:14px;padding:12px 14px}
.bday+.bday{border-top:1px dashed var(--line)}
.bday img{width:44px;height:44px;flex-shrink:0}
.bday .n{font-size:16px;font-weight:800}
.bday .w{font-size:13px;color:var(--muted)}
.foot{position:relative;margin-top:22px;display:flex;justify-content:center}

/* Fiche */
.who{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:4px}
.avatar-big{width:96px;height:96px;border-radius:50%;background:var(--band);border:2px dashed var(--ink);display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:48px;color:var(--ink)}
.title-pill{padding:5px 14px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);font-family:var(--f-hand);font-weight:700;font-size:20px;line-height:1.2}
.lvl{padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-top:26px}
.lvl-row{display:flex;justify-content:space-between;align-items:baseline}
.lvl-row b{font-family:var(--f-hand);font-weight:700;font-size:34px;color:var(--ink)}
.lvl-row span{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--band);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background-image:linear-gradient(90deg,var(--ink),var(--wash) 25%,var(--ink) 50%,var(--wash) 75%,var(--ink));background-size:200% 100%;animation:shimmer 5s linear infinite}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;margin-top:12px}
.scol{display:flex;flex-direction:column;gap:12px}
.scol+.scol{margin-top:26px}
.stat{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:6px;border:1.5px solid transparent;text-align:left;min-width:0;box-shadow:0 10px 22px rgba(90,60,30,.10)}
.stat .top{display:flex;justify-content:space-between;align-items:center}
.stat .lv{font-family:var(--f-hand);font-size:32px;font-weight:700;line-height:1}
.stat .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.stat .nm{font-size:15px;font-weight:800}
.sbar{height:6px;border-radius:999px;background:rgba(255,255,255,.7)}
.sbar i{display:block;height:100%;border-radius:999px}
.s-force{background:#EAF2E2;border-color:#CFE0C2;color:#1F2E1C} .s-force .k,.s-force .lv{color:#3F5A3A} .s-force .sbar i{background:#5E7E56}
.s-dex{background:#FCEADB;border-color:#F2CFB2;color:#3A2416} .s-dex .k,.s-dex .lv{color:#9A5230} .s-dex .sbar i{background:#B8653C}
.s-con{background:#FBE8EC;border-color:#F0CAD3;color:#3E1D27} .s-con .k,.s-con .lv{color:#9A4A60} .s-con .sbar i{background:#B85E76}
.s-int{background:#E6F0F5;border-color:#C6DBE6;color:#16303E} .s-int .k,.s-int .lv{color:#2E5E78} .s-int .sbar i{background:#3E7290}
.s-sag{background:#FBF2D6;border-color:#EEDCA6;color:#3A2E0E} .s-sag .k,.s-sag .lv{color:#8A6A14} .s-sag .sbar i{background:#A8821E}
.s-cha{background:#EFE8F7;border-color:#D8CBEA;color:#2B1F40} .s-cha .k,.s-cha .lv{color:#5B4A8C} .s-cha .sbar i{background:#6E5AA6}
.titles{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.tpill{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:800}
.tpill.on{background:var(--ink);color:#FFFDF8}
.tpill.off{border:1.5px dashed var(--line);background:rgba(255,253,248,.7);color:var(--muted);font-weight:700}

/* Gazette */
.topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tchip{min-height:40px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,253,248,.85);font-size:14px;font-weight:700}
.tchip[aria-pressed="true"]{border-color:var(--ink);background:var(--band);color:var(--ink);font-weight:800}
.news a{color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:4px}
.ncard{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;margin-top:18px}
.ncard .big{font-size:19px;font-weight:800;line-height:1.3}
.ncard .t{font-size:16px;font-weight:700;line-height:1.35}
.ncard .src{font-size:12px;color:var(--muted)}
.ncard h2{font-size:30px}
.rule-soft{height:2px;background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:8px 2px}
.dashed-btn{min-height:50px;border-radius:6px;border:1.5px dashed var(--ink);background:rgba(255,253,248,.7);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink);width:100%}

/* Navigation */

function burst(x, y){

  var cols = ["#F2C29E","#A8C29A","#CDB9E4","#E8A889","#FFE2BC"];
  for (var i=0;i<14;i++){ var b = document.createElement("span"); b.className = "burst"; b.style.left = x + "px"; b.style.top = y + "px"; b.style.background = cols[i%5]; var a = Math.random()*Math.PI*2, r = 60 + Math.random()*90; b.style.setProperty("--dx", Math.cos(a)*r + "px"); b.style.setProperty("--dy", (Math.sin(a)*r - 40) + "px"); document.body.appendChild(b); setTimeout((function(el){ return function(){ el.remove(); }; })(b), 1200); }
}

function nowISO(){ return new Date().toISOString(); }
function needDb(){ if (!db){ toast("Tes données se chargent encore. Réessaie dans un instant."); return false; } return true; }
function dbErr(e){ var c = e && e.code; toast(c === "quota_exceeded" ? "L'appli est pleine. Supprime d'anciennes quêtes pour en ajouter." : c === "resource_exhausted" ? "Doucement, trop d'actions d'un coup. Réessaie dans un instant." : "L'enregistrement n'a pas abouti. Réessaie dans un instant."); }
function award(label, stat, xp, skill){
  if (!needDb()) return Promise.resolve();
  var before = totalXP(), beforeStat = statLevel(statXP()[stat]||0), titlesBefore = unlockedTitles().length;
  return db.collection("log").add({label:label, stat:stat, xp:xp, skill:skill||null, at:nowISO()}).then(function(){
    setTimeout(function(){
      var after = totalXP();
      if (globalLevel(after) > globalLevel(before)) levelUp("Niveau " + globalLevel(after), NAME + ", tu passes niveau " + globalLevel(after) + ". Chaque petite chose faite compte.");
      else if (unlockedTitles().length > titlesBefore) levelUp(unlockedTitles()[unlockedTitles().length-1], "Nouveau titre débloqué. Il est maintenant affiché sur ta fiche.");
      else if (statLevel(statXP()[stat]||0) > beforeStat) levelUp(STATS[stat].n + " niveau " + statLevel(statXP()[stat]), "Ta caractéristique monte d'un niveau.");
    }, 700);
  }).catch(dbErr);
}

/* ---------- agenda ---------- */
function calError(e){
  var c = e && e.code;
  S.gcalState = c === "needs_auth" ? "auth" : "err";
  S.gcalMsg = c === "needs_auth" ? "" : c === "offline" ? "Pas de connexion : tu vois le dernier agenda enregistré." : c === "denied" ? "Accès à Google Agenda refusé." : "Google Agenda ne répond pas pour l'instant. Réessaie dans un moment.";
  render();
}
function normEvents(payload){
  var evs = (payload && payload.events) || [];
  return evs.filter(function(e){ return e.status !== "cancelled"; }).map(function(e){
    var s = e.start || {}, dt = s.dateTime || "", d = dt ? dt.slice(0,10) : (s.date || "");
    return {id:e.id, title:e.summary || "Sans titre", date:d, time: dt ? dt.slice(11,16) : null, location:e.location || "", allDay:!dt};
  });
}
var calRange = null;
function watchCal(){
  var t = today(), start = addDays(t, -7), end = addDays(t, 62);
  calRange = {start: iso(start), end: iso(end)};
  mcp.watchTool(GC, "list_events", {calendarId:CAL, startTime: iso(start) + "T00:00:00", endTime: iso(end) + "T23:59:00", orderBy:"startTime", pageSize:250}, function(ev){
    if (ev.type === "data"){ S.gcal = normEvents(ev.result && ev.result.payload); if (!ev.cached) S.gcalState = "ok"; render(); }
    else calError(ev.error);
  }, {refetchInterval: 300000});
}
function reminders(time){
  var r = [20160, 10080, 1440];
  if (time){ var p = time.split(":"), mins = (+p[0])*60 + (+p[1]||0); if (mins - 480 > 90) r.push(mins - 480); r.push(60); }
  return r.map(function(m){ return {method:"popup", minutes:m}; });
}
function endOf(date, time){ var p = time.split(":"); var d = new Date(+date.slice(0,4), +date.slice(5,7)-1, +date.slice(8,10), +p[0], +p[1]||0); d.setMinutes(d.getMinutes()+60); return iso(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00"; }
function createCalEvent(o){
  // o: {title, date, time|null, endTime|null, allDay, yearly}
  if (!mcp) return Promise.reject({code:"not_granted"});
  var input = {calendarId:CAL, summary:o.title};
  if (o.time){ input.startTime = o.date + "T" + o.time + ":00"; input.endTime = o.endTime ? o.date + "T" + o.endTime + ":00" : endOf(o.date, o.time); input.overrideReminders = reminders(o.time); }
  else { input.allDay = true; input.startTime = o.date + "T00:00:00"; input.endTime = iso(addDays(parseISO(o.date),1)) + "T00:00:00"; input.overrideReminders = [{method:"popup",minutes:19620},{method:"popup",minutes:9540},{method:"popup",minutes:300}]; }
  if (o.yearly) input.recurrenceData = ["RRULE:FREQ=YEARLY"];
  return mcp.callTool(GC, "create_event", input).then(function(r){ try { mcp.invalidate(GC, "list_events"); } catch(e){} return r; });
}
function calWriteMsg(e){
  var c = e && e.code;
  return c === "needs_auth" ? "Synchronise Google Agenda (bouton dans « Cette semaine ») : le rendez-vous est gardé dans l'appli en attendant."
    : c === "offline" ? "Pas de connexion : le rendez-vous est gardé dans l'appli."
    : (c === "server_unavailable" || c === "upstream_error") ? "Google Agenda n'a pas confirmé. Vérifie ton agenda avant de réessayer."
    : "Le rendez-vous n'a pas pu aller dans ton agenda : il est gardé dans l'appli.";
}

/* ---------- compréhension de la phrase (100 % locale, sans IA ni connexion) ---------- */
var WD = {dimanche:0,lundi:1,mardi:2,mercredi:3,jeudi:4,vendredi:5,samedi:6};
var MOIS_N = ["janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"];
function noAcc(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g, ""); }
/* caractéristique selon les mots de la phrase */
var STAT_WORDS = [
  ["force", /danse|danser|sport|marche|course|courir|yoga|pilates|muscu|salle|velo|natation|nager|randonn|stretch|etire|footing|fitness|gym/],
  ["con", /medecin|docteur|dentiste|gyneco|kine|osteo|ophtalmo|dermato|gastro|pharmacie|ordonnance|analyse|prise de sang|sommeil|dormir|sieste|bain|soin|masque|coiffeur|manucure|meditation|respir|vaccin|sante|mutuelle|lunettes|lentilles/],
  ["int", /lire|livre|lecture|apprendre|cours|formation|langue|anglais|vietnamien|italien|espagnol|etudier|reviser|documentaire|podcast|tuto/],
  ["dex", /cuisine|cuisiner|recette|gateau|patisserie|bricol|monter|reparer|peindre|peinture|plante|jardin|rempoter|arroser|coudre|tricot|dessin|creer|decor|lapin/],
  ["cha", /maman|papa|frere|soeur|\bami|\bamie|copine|copain|famille|anniv|cadeau|inviter|diner avec|prendre des nouvelles/],
  ["sag", /garage|voiture|controle technique|assurance|impot|banque|facture|papier|administr|dossier|resilier|abonnement|menage|ranger|rangement|lessive|courses|vaisselle|aspirateur|trier|demenag|maison|appartement|notaire|pret|budget|caf|mairie|passeport|carte d.identite|permis/]
];
function guessStat(s){ var n = noAcc(s.toLowerCase()); for (var i=0;i<STAT_WORDS.length;i++) if (STAT_WORDS[i][1].test(n)) return STAT_WORDS[i][0]; return "sag"; }
/* étapes d'une quête : de petites étapes concrètes, la première faisable en deux minutes */
var QUEST_TPL = [
  [/appeler|telephoner|rappeler/, function(t){ return ["Trouver le numéro", "Choisir un moment pour appeler", "Appeler (10 minutes suffisent)"]; }],
  [/ecrire|mail|e-mail|message|repondre|courrier|lettre/, function(t){ return ["Ouvrir le message ou une page vide", "Écrire trois phrases, même imparfaites", "Relire et envoyer"]; }],
  [/ranger|trier|menage|nettoyer|vider|desencombrer|placard|armoire/, function(t){ return ["Prendre un sac et vider une seule étagère", "Trier : garder, donner, jeter", "Ranger le reste (20 minutes max)"]; }],
  [/acheter|commander|cadeau|courses/, function(t){ return ["Noter ce qu'il faut exactement", "Choisir où l'acheter", "Commander ou y aller"]; }],
  [/impot|declaration|dossier|papier|formulaire|resilier|assurance|banque|mutuelle|caf|administr|passeport|carte d.identite|permis/, function(t){ return ["Rassembler les papiers nécessaires", "Ouvrir le site ou le formulaire", "Remplir et envoyer"]; }],
  [/reparer|monter|bricol|peindre|installer|changer/, function(t){ return ["Regarder ce qu'il faut (outil, pièce)", "Préparer le matériel", "Faire la réparation"]; }],
  [/organiser|preparer|planifier|voyage|vacances|fete|anniv|soiree/, function(t){ return ["Noter les idées en vrac (2 minutes)", "Choisir la date et les personnes", "Réserver ou envoyer les invitations"]; }],
  [/lire|apprendre|reviser|cours|formation/, function(t){ return ["Ouvrir le livre ou le cours", "Faire une première session de 15 minutes", "Prévoir la prochaine session"]; }],
  [/rendez.vous|rdv|medecin|docteur|dentiste|kine|osteo|ophtalmo|dermato|gyneco|coiffeur|garage|controle technique|revision|vidange|pneu/, function(t){ return ["Trouver le numéro ou le site", "Appeler ou réserver le créneau", "Noter la date dans l'appli"]; }]
];
function questSteps(title){
  var n = noAcc(title.toLowerCase());
  for (var i=0;i<QUEST_TPL.length;i++) if (QUEST_TPL[i][0].test(n)) return QUEST_TPL[i][1](title);
  return ["Noter ce qu'il faut pour commencer (2 minutes)", "Faire la première vraie action", "Terminer et cocher"];
}
function questXP(title){ var n = noAcc(title.toLowerCase()); return /impot|declaration|demenag|dossier|administr|resilier|notaire|garage|voiture|dentiste/.test(n) ? 70 : /ranger|trier|menage|reparer|bricol/.test(n) ? 50 : 40; }
function exploitXP(s){ var n = noAcc(s.toLowerCase()); var m = n.match(/(\d+(?:[.,]\d+)?)\s*h(?!\d)/), mn = n.match(/(\d+)\s*min/); var mins = m ? parseFloat(m[1].replace(",", "."))*60 : mn ? +mn[1] : 0; if (mins) return Math.max(10, Math.min(40, Math.round(mins/3))); return 15; }
function skillOf(s){ var n = noAcc(s.toLowerCase());
  var map = [[/danse|danser/,"Danse"],[/yoga/,"Yoga"],[/pilates/,"Pilates"],[/marche|randonn/,"Marche"],[/course|courir|footing/,"Course"],[/velo/,"Vélo"],[/\bnager|\bnage\b|natation|piscine/,"Natation"],[/lu |lire|lecture|livre/,"Lecture"],[/cuisin|recette/,"Cuisine"],[/patisserie|gateau/,"Pâtisserie"],[/plante|jardin|rempot|arros/,"Plantes"],[/menage|ranger|rangement|aspirateur/,"Maison"],[/anglais|vietnamien|italien|espagnol|langue/,"Langues"],[/dessin|peint/,"Dessin"],[/tricot|coud/,"Couture"]];
  for (var i=0;i<map.length;i++) if (map[i][0].test(n)) return map[i][1]; return null; }
function stripWords(text){
  return text.replace(/\b(le\s+)?\d{1,2}(er)?\s+(janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)\b/ig,"")
    .replace(/\b(le\s+)?\d{1,2}\/\d{1,2}\b/g,"")
    .replace(/\b(ce\s+|cette\s+)?(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(\s+(prochain|matin|soir|après-midi|apres-midi))?\b/ig,"")
    .replace(/\b(après-demain|apres-demain|demain|aujourd'hui|aujourd’hui|ce soir|ce matin)\b/ig,"")
    .replace(/\b(à|a|vers|de)?\s*\d{1,2}\s*h\s*(\d{2})?(\s*(à|a|-)\s*\d{1,2}\s*h\s*(\d{2})?)?/ig,"")
    .replace(/\brdv\b/ig,"rendez-vous").replace(/\bdoc\b/ig,"docteur")
    .replace(/^(il faut que je|je dois|faut que je|penser à|penser a|ne pas oublier de|ne pas oublier d')\s*/i,"")
    .replace(/\s+/g," ").replace(/^[\s,.;:-]+|[\s,.;:-]+$/g,"").replace(/\s+(à|a|vers|de|le|la|pour)$/i,"").trim();
}
function localParse(text){
  var s = text.toLowerCase().trim(), n = noAcc(s), t = today(), date = null, time = null, endTime = null;
  var tm = s.match(/(\d{1,2})\s*h\s*(\d{2})?(?:\s*(?:à|a|-)\s*(\d{1,2})\s*h\s*(\d{2})?)?/);
  if (tm){ time = pad(+tm[1]) + ":" + (tm[2] || "00"); if (tm[3]) endTime = pad(+tm[3]) + ":" + (tm[4] || "00"); }
  if (/apres-demain/.test(n)) date = addDays(t,2); else if (/demain/.test(n)) date = addDays(t,1); else if (/aujourd|ce soir|ce matin/.test(n)) date = t;
  var wd = n.match(/\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/);
  if (!date && wd){ var target = WD[wd[1]], diff = (target - t.getDay() + 7) % 7 || 7; if (/prochain/.test(n) && diff < 7) diff += 0; date = addDays(t, diff); }
  var dm = n.match(/\b(\d{1,2})(?:er)?\s+(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)/);
  if (dm){ var mi = MOIS_N.indexOf(dm[2]); var dd = new Date(t.getFullYear(), mi, +dm[1]); if (dd < t) dd = new Date(t.getFullYear()+1, mi, +dm[1]); date = dd; }
  var sl = n.match(/\b(\d{1,2})\/(\d{1,2})\b/); if (!date && sl){ var d2 = new Date(t.getFullYear(), +sl[2]-1, +sl[1]); if (d2 < t) d2 = new Date(t.getFullYear()+1, +sl[2]-1, +sl[1]); date = d2; }
  var title = cap(stripWords(text) || text);
  /* anniversaire */
  if (/anniv/.test(n)){
    var pm = text.match(/anniv(?:ersaire)?\s+(?:de\s+|d['’]\s*)?(\S+)(?:\s+(\S+))?/i), who2 = null;
    if (pm){ who2 = cap(pm[1].replace(/[,.;:]$/,"")); if (pm[2] && /^[A-ZÀ-Ü]/.test(pm[2]) && !/^(Le|La|Les|Du|En|Au)$/.test(pm[2])) who2 += " " + pm[2].replace(/[,.;:]$/,""); }
    return {kind:"birthday", person: who2 || title, date: date ? iso(date) : null, title:"Anniversaire", xp:0};
  }
  /* j'ai appelé / vu / écrit à un proche */
  var known = S.people.find(function(p){ return n.indexOf(noAcc(p.name.toLowerCase())) >= 0; });
  if (/^(j'ai|j’ai|jai)\s+(appel|vu|ecrit|parl|dine|dejeune|pris des nouvelles|envoye)/.test(n) && (known || /maman|papa|frere|soeur|ami|copine|copain/.test(n))){
    var who = known ? known.name : (n.match(/\b(maman|papa)\b/) ? cap(n.match(/\b(maman|papa)\b/)[1]) : null);
    return {kind:"contact", person: who, title:title, xp:15, stat:"cha"};
  }
  /* exploit : quelque chose de déjà fait */
  if (/^(j'ai|j’ai|jai|fait|fini|termine)\b|^\d+(?:[.,]\d+)?\s*(h|min)/.test(n)){
    var st = guessStat(s); return {kind:"exploit", title:cap(text.trim()), xp:exploitXP(s), stat: st === "cha" && !known ? "sag" : st, skill:skillOf(s)};
  }
  /* prendre des nouvelles */
  if (/demander (des nouvelles|a |à )|prendre des nouvelles|penser a demander/.test(n)){
    var wf = known ? known.name : null;
    return {kind:"followup", title:title, date: iso(date || addDays(t,1)), person:wf, xp:15, stat:"cha"};
  }
  /* rendez-vous daté */
  if (date) return {kind:"event", title:title, date:iso(date), time:time, endTime:endTime, xp:0};
  /* sinon : une quête */
  return {kind:"quest", title:title, steps:questSteps(title), xp:questXP(title), stat:guessStat(s)};
}
function understand(text){ return Promise.resolve(localParse(text)); }

function describe(r){
  var d = r.date ? fmtDay(parseISO(r.date)) : "";
  switch (r.kind){
    case "event": return "Rendez-vous « " + r.title + " » " + d + (r.time ? " à " + fmtTime(r.time) : "");
    case "birthday": return "Anniversaire de " + r.person + (d ? " · " + d : "");
    case "followup": return "Rappel : " + r.title + (d ? " · " + d : "");
    case "quest": return "Nouvelle quête : " + r.title;
    case "exploit": return "+" + (r.xp||15) + " XP en " + (STATS[r.stat] || STATS.sag).n;
    case "contact": return "Lien entretenu" + (r.person ? " avec " + r.person : "") + " · +15 XP";
  }
  return r.title || "";
}

function commit(r){
  var stat = STATS[r.stat] ? r.stat : "sag";
  var base = {title: cap(r.title || ""), createdAt: nowISO()};
  if (r.kind === "event"){
    if (!r.date){ r.kind = "quest"; return commit(r); }
    if (!r.time) return db.collection("items").add(Object.assign(base, {kind:"event", date:r.date, time:null})).then(function(){ toast("Noté. Il manque l'heure : touche « À compléter » quand tu la sais."); });
    return createCalEvent({title:base.title, date:r.date, time:r.time, endTime:r.endTime}).then(function(){ toast("Ajouté à ton agenda. Rappels à J-14, J-7, la veille, le matin et 1 h avant."); }).catch(function(e){
      toast(calWriteMsg(e)); if (e && (e.code === "server_unavailable" || e.code === "upstream_error")) return;
      return db.collection("items").add(Object.assign(base, {kind:"event", date:r.date, time:r.time, unsynced:true}));
    });
  }
  if (r.kind === "birthday"){
    var person = cap(r.person || r.title || "");
    if (!r.date){ return db.collection("items").add(Object.assign(base, {kind:"birthday", person:person, md:null})).then(function(){ toast("Il me manque la date de l'anniversaire de " + person + "."); }); }
    var md = r.date.slice(5);
    return db.collection("items").add(Object.assign(base, {kind:"birthday", person:person, md:md})).then(function(){
      return createCalEvent({title:"Anniversaire de " + person, date: iso(nextOccurrence(md)), time:null, yearly:true}).then(function(){ toast("Anniversaire de " + person + " noté. Rappels à J-14, J-7 et la veille."); }).catch(function(e){ toast("Anniversaire noté dans l'appli. " + calWriteMsg(e).replace(/le rendez-vous est gardé dans l'appli\.?/,"")); });
    });
  }
  if (r.kind === "followup") return db.collection("items").add(Object.assign(base, {kind:"followup", date: r.date || iso(addDays(today(),1)), person: r.person ? cap(r.person) : null, done:false})).then(function(){ toast("Je te le rappelle " + (r.date ? fmtDay(parseISO(r.date)) : "demain") + "."); });
  if (r.kind === "quest"){
    var steps = (Array.isArray(r.steps) ? r.steps : []).slice(0,5).map(function(t){ return {t: cap(String(t)), done:false}; });
    return db.collection("items").add(Object.assign(base, {kind:"quest", steps:steps, stat:stat, xp: Math.max(20, Math.min(100, +r.xp || 40)), done:false})).then(function(){ toast("Nouvelle quête. Première étape : " + (steps[0] ? steps[0].t.toLowerCase() : base.title.toLowerCase()) + "."); });
  }
  if (r.kind === "contact"){
    var name = r.person ? cap(r.person) : null;
    var p = name && S.people.find(function(x){ return x.name.toLowerCase() === name.toLowerCase(); });
    var w = p ? db.collection("people").doc(p._id).update({last: iso(today())}) : name ? db.collection("people").add({name:name, every:21, last: iso(today())}) : Promise.resolve();
    return w.then(function(){ return award(base.title, "cha", 15, "Prendre des nouvelles"); }).then(function(){ toast("Lien entretenu" + (name ? " avec " + name : "") + ". +15 XP en Liens."); });
  }
  // exploit
  var xp = Math.max(5, Math.min(60, +r.xp || 15));
  return award(base.title, stat, xp, r.skill).then(function(){ toast("Bien joué. +" + xp + " XP en " + STATS[stat].n + "."); burst(window.innerWidth/2, window.innerHeight - 150); });
}

function onCapture(e){
  e.preventDefault();
  var input = document.getElementById("captureInput"), btn = document.getElementById("captureBtn"), hint = document.getElementById("captureHint");
  var text = input.value.trim(); if (!text) return;
  if (!needDb()) return;
  btn.disabled = true; hint.textContent = "Je range ça…";
  understand(text).then(function(r){
    btn.disabled = false; input.value = "";
    var cancelled = false;
    hint.innerHTML = "<strong>" + h(describe(r)) + "</strong>";
    toast(describe(r), {ms:3800, undo:function(){ cancelled = true; hint.textContent = "Annulé."; input.value = text; input.focus(); setTimeout(function(){ if (hint.textContent === "Annulé.") hint.textContent = ""; }, 3000); }, after:function(){ if (cancelled) return; Promise.resolve(commit(r)).catch(dbErr).then(function(){ setTimeout(function(){ hint.textContent = ""; }, 4000); }); }});
  });
}

/* ---------- fenêtres ---------- */
function openSheet(title, body, onMount){
  var root = document.getElementById("sheetRoot");
  root.innerHTML = '<div class="sheet-wrap" id="sw"><div class="sheet gut" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="sheet-head"><h2 id="sht">' + h(title) + '</h2><button type="button" class="close" data-act="close" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="sheetBody">' + body + '</div></div></div>';
  document.getElementById("sw").addEventListener("click", function(e){ if (e.target.id === "sw") closeSheet(); });
  if (onMount) onMount();
  var f = root.querySelector(".close"); if (f) f.focus();
}
function closeSheet(){ document.getElementById("sheetRoot").innerHTML = ""; }

function monthKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1); }
function ensureMonth(m0){
  var key = monthKey(m0), dim = new Date(m0.getFullYear(), m0.getMonth()+1, 0).getDate();
  var first = iso(m0), last = iso(new Date(m0.getFullYear(), m0.getMonth(), dim));
  if (!mcp || S.gcalState !== "ok") return;
  if (calRange && first >= calRange.start && last <= calRange.end) return;
  if (S.gcalExtra[key] || S.monthLoading[key]) return;
  S.monthLoading[key] = true;
  mcp.callTool(GC, "list_events", {calendarId:CAL, startTime:first + "T00:00:00", endTime:last + "T23:59:00", orderBy:"startTime", pageSize:250}, {cache:{staleTime:300000}}).then(function(r){
    S.gcalExtra[key] = normEvents(r && r.payload);
  }).catch(function(e){ S.gcalExtra[key] = []; S.monthErr[key] = (e && (e.code === "server_unavailable" || e.code === "upstream_error")) ? "Google Agenda ne répond pas pour ce mois. Réessaie dans un moment." : "Les rendez-vous Google Agenda de ce mois ne sont pas disponibles."; }).then(function(){
    S.monthLoading[key] = false; var mb = document.getElementById("mBody"); if (mb) mb.innerHTML = monthHTML();
  });
}
function evLine(e){ return '<div class="ev"><span class="ev-t">' + h(e.title) + '</span><span class="ev-m">' + h(e.todo ? "Heure à compléter" : (e.time ? fmtTime(e.time) : "Toute la journée") + (e.meta ? " · " + e.meta : "")) + '</span></div>'; }
function monthHTML(){
  var t = today(), m0 = new Date(t.getFullYear(), t.getMonth() + S.monthOffset, 1), dim = new Date(m0.getFullYear(), m0.getMonth()+1, 0).getDate();
  var key = monthKey(m0); ensureMonth(m0);
  if (!S.monthSel || S.monthSel.slice(0,7) !== key) S.monthSel = (monthKey(t) === key) ? iso(t) : iso(m0);
  var lead = (m0.getDay() + 6) % 7, cells = [];
  ["lun","mar","mer","jeu","ven","sam","dim"].forEach(function(d){ cells.push('<div class="h" aria-hidden="true">' + d + '</div>'); });
  for (var i=0;i<lead;i++) cells.push('<div class="mcell blank" aria-hidden="true"></div>');
  for (var d=1; d<=dim; d++){
    var dt = new Date(m0.getFullYear(), m0.getMonth(), d), di = iso(dt), evs = eventsOn(di);
    var cls = "mcell" + (di === iso(t) ? " today" : "") + (di === S.monthSel ? " sel" : "");
    cells.push('<button type="button" class="' + cls + '" data-act="mday" data-d="' + di + '" aria-pressed="' + (di === S.monthSel) + '" aria-label="' + h(fmtDay(dt) + (evs.length ? ", " + evs.length + " événement" + (evs.length>1?"s":"") : ", rien de prévu")) + '"><span>' + d + '</span><span class="dots" aria-hidden="true">' + evs.slice(0,3).map(function(){ return "<i></i>"; }).join("") + '</span></button>');
  }
  var sel = parseISO(S.monthSel), selEvs = eventsOn(S.monthSel);
  var panel = '<div class="mpanel"><p class="eyebrow" style="color:var(--muted)">' + h(cap(fmtDay(sel))) + '</p>'
    + (S.monthLoading[key] ? '<p class="soft-empty" style="padding:0">Je récupère ton agenda…</p>' : selEvs.length ? selEvs.map(evLine).join("") : '<p class="soft-empty" style="padding:0">Rien de prévu ce jour-là.</p>')
    + (S.monthErr[key] ? '<p class="notice" style="margin:8px 0 0">' + h(S.monthErr[key]) + '</p>' : "") + '</div>';
  return '<div class="row" style="justify-content:space-between"><button type="button" class="btn light" data-act="mprev" aria-label="Mois précédent">‹</button><h3 style="font-size:22px">' + cap(MOIS[m0.getMonth()]) + ' ' + m0.getFullYear() + '</h3><button type="button" class="btn light" data-act="mnext" aria-label="Mois suivant">›</button></div>'
    + '<div class="month">' + cells.join("") + '</div>' + panel;
}
function settingsHTML(){
  var st = S.settings || {}, topics = st.topics || [];
  var bd = st.birthday ? "2000-" + st.birthday : "";
  var pm = previewMonth();
  var prev = '<h3 style="margin-bottom:6px">Décor du carnet</h3><p style="font-size:13px;color:var(--muted);margin-bottom:8px">L\'appli change de décor chaque mois, et pour Noël, le Nouvel An et ton anniversaire. Tu peux regarder les autres décors ici.</p><div class="field"><label for="pmSel">Décor affiché</label><select id="pmSel"><option value="">Selon la date du jour</option>' + THEMES.map(function(mm, i){ return '<option value="' + i + '"' + (pm === i ? " selected" : "") + '>' + mm.name + '</option>'; }).join("") + Object.keys(FETE_NAMES).map(function(k){ return '<option value="' + k + '"' + (pm === k ? " selected" : "") + '>' + FETE_NAMES[k] + '</option>'; }).join("") + '</select></div><div style="height:12px"></div>';

    + '<form id="fP" class="fgrid" style="margin:12px 0 22px"><div class="field wide"><label for="pName">Prénom</label><input id="pName" type="text" required></div><div class="field"><label for="pEvery">Rythme</label><select id="pEvery"><option value="7">7 jours</option><option value="14" selected>14 jours</option><option value="21">21 jours</option><option value="30">30 jours</option><option value="60">60 jours</option></select></div><button class="btn green" type="submit">Ajouter</button></form>'

    + '<h3 style="margin:26px 0 6px">Sauvegarde</h3><p style="font-size:13px;color:var(--muted);margin-bottom:10px">Télécharge une copie de toutes tes données, ou importe une sauvegarde.</p><div class="bk-row"><button type="button" class="btn light" data-act="export">Télécharger</button><button type="button" class="btn light" data-act="import">Importer</button><input type="file" id="impFile" accept="application/json,.json" hidden></div>'
    + '<div style="margin-top:26px"><button type="button" class="mini" data-act="signout">Se déconnecter</button></div>';
}
function mountSettings(){
  var ps = document.getElementById("pmSel"); if (ps) ps.onchange = function(){ try { if (ps.value === "") localStorage.removeItem("previewMonth"); else localStorage.setItem("previewMonth", ps.value); } catch(e){} applyMonth(); makeDrift(); render(); };
  var imp = document.getElementById("impFile"); if (imp) imp.onchange = function(){ var f = imp.files && imp.files[0]; if (!f || !needDb()) return; f.text().then(function(t){ var j = JSON.parse(t); if (!j || !j.collections) throw new Error("format"); return db.importAll(j); }).then(function(n){ toast("Sauvegarde importée (" + n + " éléments)."); closeSheet(); }).catch(function(){ toast("Ce fichier n'est pas une sauvegarde valide."); }); };
  var fb = document.getElementById("fBd"), fp = document.getElementById("fP"), ft = document.getElementById("fT");
  if (fb) fb.onsubmit = function(e){ e.preventDefault(); var v = document.getElementById("bdIn").value; saveSettings({birthday: v ? v.slice(5) : null}).then(function(){ toast(v ? "Ton anniversaire est noté." : "Date retirée."); applyMonth(); makeDrift(); render(); }); };

  ft.onsubmit = function(e){ e.preventDefault(); var n = document.getElementById("tName").value.trim(); if (!n) return; var topics = ((S.settings && S.settings.topics) || []).slice(); if (topics.indexOf(n) < 0) topics.push(n); saveSettings({topics:topics}).then(function(){ toast("Sujet ajouté. Il apparaîtra dès qu'il y aura du nouveau."); refreshSettings(); }); };
}
function exportBackup(){
  var strip = function(arr){ var o = {}; arr.forEach(function(d){ var c = Object.assign({}, d); delete c._id; o[d._id] = c; }); return o; };
  var data = {version:1, exportedAt: nowISO(), collections:{items:strip(S.items), people:strip(S.people), log:strip(S.log), gazette:strip(S.gazette)}, settings: S.settings || {}};
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:"application/json"})); a.download = "sauvegarde-carnet-" + iso(today()) + ".json"; document.body.appendChild(a); a.click(); a.remove();
}
function refreshSettings(){ var b = document.getElementById("sheetBody"); if (b && document.getElementById("fT")){ b.innerHTML = settingsHTML(); mountSettings(); } }
function saveSettings(patch){
  if (!needDb()) return Promise.resolve();
  var ref = db.doc("settings/main");
  var p = S.settings ? ref.update(patch) : ref.set(Object.assign({topics:[], birthday:null}, patch));
  return p.then(function(){ S.settings = Object.assign({}, S.settings || {}, patch); }).catch(dbErr);
}

function statSheet(k){
  var st = STATS[k], logs = S.log.filter(function(l){ return l.stat === k; }).sort(function(a,b){ return (b.at||"") > (a.at||"") ? 1 : -1; });
  var skills = {}; logs.forEach(function(l){ if (l.skill){ skills[l.skill] = (skills[l.skill]||0) + (+l.xp||0); } });
  var sk = Object.keys(skills).sort(function(a,b){ return skills[b]-skills[a]; });
  var body = '<p style="color:var(--muted);margin-bottom:16px">' + st.k + ' · niveau ' + statLevel(statXP()[k]) + ' · ' + statXP()[k] + ' XP</p>'
    + '<h3 style="margin-bottom:8px">Compétences</h3>' + (sk.length ? sk.map(function(s){ return '<div class="list-line"><span>' + h(s) + '</span><span class="tag">Niv. ' + statLevel(skills[s]) + '</span></div>'; }).join("") : '<p class="soft-empty" style="padding:0 0 10px">Elles apparaissent au fil de ce que tu fais.</p>')
    + '<h3 style="margin:18px 0 8px">Derniers exploits</h3>' + (logs.length ? logs.slice(0,8).map(function(l){ return '<div class="list-line"><span>' + h(l.label) + '</span><span style="font-variant-numeric:tabular-nums">+' + (+l.xp||0) + ' XP</span></div>'; }).join("") : '<p class="soft-empty" style="padding:0">Rien pour l\'instant.</p>');
  openSheet(st.n, body);
}
function completeEventSheet(id){
  var it = S.items.find(function(i){ return i._id === id; }); if (!it) return;
  openSheet("Compléter le rendez-vous", '<p style="margin-bottom:14px"><b>' + h(it.title) + '</b> · ' + h(fmtDay(parseISO(it.date))) + '</p><form id="fEv"><div class="row"><div class="field" style="flex:1"><label for="evT">Heure de début</label><input id="evT" type="time" required></div><div class="field" style="flex:1"><label for="evE">Heure de fin (facultatif)</label><input id="evE" type="time"></div></div><div class="row"><button class="btn green" type="submit">Ajouter à mon agenda</button><button class="btn light" type="button" id="evAll">Toute la journée</button><button class="btn light" type="button" data-act="del-item" data-id="' + h(id) + '">Supprimer</button></div></form>', function(){
    function go(time, end){
      createCalEvent({title:it.title, date:it.date, time:time, endTime:end}).then(function(){ return db.collection("items").doc(id).delete(); }).then(function(){ closeSheet(); toast("Ajouté à ton agenda avec tes rappels."); }).catch(function(e){ if (e && e.code && !/^(invalid_argument|unavailable)$/.test(e.code)){ toast(calWriteMsg(e)); if (e.code === "server_unavailable" || e.code === "upstream_error") return; db.collection("items").doc(id).update({time:time, unsynced:true}).then(closeSheet).catch(dbErr); } else dbErr(e); });
    }
    document.getElementById("fEv").onsubmit = function(e){ e.preventDefault(); go(document.getElementById("evT").value, document.getElementById("evE").value || null); };
    document.getElementById("evAll").onclick = function(){ go(null, null); };
  });
}

/* ---------- actions ---------- */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if (act === "close"){ closeSheet(); return; }
  if (act === "mday"){ S.monthSel = b.dataset.d; document.getElementById("mBody").innerHTML = monthHTML(); var fb2 = document.querySelector('.mcell[data-d="' + S.monthSel + '"]'); if (fb2) fb2.focus({preventScroll:true}); return; }
  if (act === "month"){ S.monthOffset = 0; S.monthSel = null; openSheet("Le mois", '<div id="mBody">' + monthHTML() + '</div>'); return; }
  if (act === "mprev" || act === "mnext"){ S.monthOffset += act === "mnext" ? 1 : -1; document.getElementById("mBody").innerHTML = monthHTML(); return; }
  if (act === "settings"){ openSheet("Réglages", settingsHTML(), mountSettings); return; }
  if (act === "gcal-connect"){ if (mcp && mcp.connect) mcp.connect().then(function(){ toast("Google Agenda est synchronisé."); }).catch(function(){ toast(navigator.onLine ? "La connexion à Google Agenda n'a pas abouti." : "Pas de connexion internet pour l'instant."); }); return; }
  if (act === "export"){ exportBackup(); return; }
  if (act === "import"){ var fi = document.getElementById("impFile"); if (fi) fi.click(); return; }
  if (act === "signout"){ if (window.APP_SIGNOUT) window.APP_SIGNOUT(); return; }
  if (act === "topic"){ S.topicFilter = b.dataset.t; render(); return; }
  if (act === "acc-sec"){ S.accSection = b.dataset.s; try { localStorage.setItem("accSection", S.accSection); } catch(err){} var sx = document.querySelector(".bubbles-wrap"), keep = sx ? sx.scrollLeft : 0; render(); var nx2 = document.querySelector(".bubbles-wrap"); if (nx2) nx2.scrollLeft = keep; var pb = document.querySelector('.bubble[data-s="' + S.accSection + '"]'); if (pb) pb.focus({preventScroll:true}); return; }
  if (act === "stat"){ statSheet(b.dataset.k); return; }
  if (act === "complete-event"){ completeEventSheet(id); return; }
  if (!needDb()) return;
  if (act === "step"){
    var q = S.items.find(function(i){ return i._id === id; }); if (!q) return;
    var i = +b.dataset.i, steps = (q.steps||[]).map(function(s){ return {t:s.t, done:s.done}; });
    if (steps[i].done){ steps[i].done = false; db.collection("items").doc(id).update({steps:steps}).catch(dbErr); return; }
    steps[i].done = true;
    var r = b.getBoundingClientRect(); burst(r.left + 24, r.top + 20);
    var all = steps.every(function(s){ return s.done; });
    var per = Math.max(5, Math.round((q.xp||40) / Math.max(steps.length,1) / 2));
    db.collection("items").doc(id).update(all ? {steps:steps, done:true, doneAt:nowISO()} : {steps:steps}).then(function(){
      if (all) return award("Quête : " + q.title, q.stat || "sag", q.xp || 40, null).then(function(){ toast("Mission accomplie, " + NAME + ". +" + (q.xp||40) + " XP en " + (STATS[q.stat]||STATS.sag).n + "."); });
      var nx = steps.find(function(s){ return !s.done; });
      return award(steps[i].t, q.stat || "sag", per, null).then(function(){ toast("Objectif validé. +" + per + " XP." + (nx ? " Prochaine étape : " + nx.t.toLowerCase() + "." : "")); });
    }).catch(dbErr);
    return;
  }
  if (act === "quest-done"){ var qq = S.items.find(function(i){ return i._id === id; }); if (!qq) return; db.collection("items").doc(id).update({done:true, doneAt:nowISO()}).then(function(){ return award("Quête : " + qq.title, qq.stat||"sag", qq.xp||40, null); }).then(function(){ toast("Mission accomplie. +" + (qq.xp||40) + " XP."); }).catch(dbErr); return; }
  if (act === "del-item"){ var it = S.items.find(function(i){ return i._id === id; }); db.collection("items").doc(id).delete().then(function(){ closeSheet(); toast("Supprimé.", {undo: it ? function(){ var c = Object.assign({}, it); delete c._id; db.collection("items").doc(id).set(c).catch(dbErr); } : null}); }).catch(dbErr); return; }
  if (act === "contacted"){ var p = S.people.find(function(x){ return x._id === id; }); if (!p) return; var rr = b.getBoundingClientRect(); burst(rr.left + 30, rr.top); db.collection("people").doc(id).update({last: iso(today())}).then(function(){ return award("Nouvelles de " + p.name, "cha", 15, "Prendre des nouvelles"); }).then(function(){ toast("Lien entretenu avec " + p.name + ". +15 XP en Liens."); }).catch(dbErr); return; }
  if (act === "follow-done"){ var f = S.items.find(function(i){ return i._id === id; }); if (!f) return; db.collection("items").doc(id).update({done:true}).then(function(){ return award(f.title, "cha", 15, "Prendre des nouvelles"); }).then(function(){ toast("C'est noté. +15 XP en Liens."); }).catch(dbErr); return; }
  if (act === "del-person"){ db.collection("people").doc(id).delete().then(function(){ setTimeout(refreshSettings, 300); }).catch(dbErr); return; }
  if (act === "del-topic"){ var t = b.dataset.t, topics = ((S.settings && S.settings.topics) || []).filter(function(x){ return x !== t; }); saveSettings({topics:topics}).then(refreshSettings); return; }
});

var TABS = ["accueil","quetes","fiche","gazette"];
function route(){
  var hsh = (location.hash || "").replace("#",""), prev = S.view;
  S.view = TABS.indexOf(hsh) >= 0 ? hsh : "accueil";
  render(); window.scrollTo(0,0);
  if (prev && prev !== S.view){
    var app = document.getElementById("app"), cls = TABS.indexOf(S.view) > TABS.indexOf(prev) ? "slide-next" : "slide-prev";
    app.classList.remove("slide-next","slide-prev"); void app.offsetWidth; app.classList.add(cls);
    setTimeout(function(){ app.classList.remove(cls); }, 300);
  }
}
/* glisser le doigt à gauche ou à droite pour changer de page */
(function(){
  var x0 = null, y0 = 0, t0 = 0;
  document.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1 || document.querySelector(".sheet-wrap,.levelup")) { x0 = null; return; }
    if (e.target.closest(".bubbles-wrap,.topics,input,select,textarea,.month")) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - t0 > 700) return;
    var i = TABS.indexOf(S.view) + (dx < 0 ? 1 : -1);
    if (i < 0 || i >= TABS.length) return;
    location.hash = TABS[i];
  }, {passive:true});
})();
/* dictée vocale dans la barre d'ajout */
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, btn = document.getElementById("micBtn");
  if (!SR || !btn) return;
  btn.hidden = false;
  var rec = null, input = document.getElementById("captureInput"), hint = document.getElementById("captureHint"), base = "";
  function stop(){ if (hint.textContent === "Je t'écoute…") hint.textContent = ""; btn.classList.remove("on"); btn.setAttribute("aria-pressed","false"); btn.setAttribute("aria-label","Dicter"); rec = null; }
  btn.addEventListener("click", function(){
    if (rec){ rec.stop(); return; }
    if (!navigator.onLine){ toast("La dictée a besoin d'internet. Tu peux utiliser le micro de ton clavier."); return; }
    rec = new SR(); rec.lang = "fr-FR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    base = input.value ? input.value.replace(/\s+$/,"") + " " : "";
    rec.onresult = function(ev){ var txt = ""; for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript; input.value = base + txt.trim(); };
    rec.onerror = function(ev){ var c = ev && ev.error; if (c === "not-allowed" || c === "service-not-allowed") toast("Autorise le micro pour cette appli dans les réglages de Chrome."); else if (c === "no-speech") toast("Je n'ai rien entendu. Réessaie."); else if (c !== "aborted") toast("La dictée n'a pas fonctionné. Réessaie."); stop(); };
    rec.onend = function(){ var had = rec !== null; stop(); if (had && input.value.trim()){ input.focus(); hint.innerHTML = "<strong>Vérifie, puis touche +</strong>"; setTimeout(function(){ if (hint.textContent === "Vérifie, puis touche +") hint.textContent = ""; }, 5000); } };
    try { rec.start(); btn.classList.add("on"); btn.setAttribute("aria-pressed","true"); btn.setAttribute("aria-label","Arrêter la dictée"); hint.textContent = "Je t'écoute…"; }
    catch(e){ stop(); toast("La dictée n'a pas pu démarrer."); }
  });
})();
window.addEventListener("hashchange", route);

/* ---------- démarrage ---------- */
function snap(col, key, order){
  var ref = db.collection(col); if (order) ref = ref.orderBy(order[0], order[1]).limit(order[2]);
  ref.onSnapshot(function(s){ S[key] = s.docs.map(function(d){ var o = Object.assign({}, d.data()); o._id = d.id; return o; }); S.dbState = "ok"; render(); }, function(e){ if (e && e.code === "revoked"){ S.dbState = "off"; render(); } });
}
applyMonth(); makePaper(); makeDrift(); route();
setInterval(function(){ var before = S.sceneKey; applyMonth(); if (before !== S.sceneKey){ makeDrift(); } render(); }, 600000);

  db = dbApi; mcp = calApi;
  snap("items","items"); snap("people","people"); snap("log","log"); snap("gazette","gazette",["addedAt","desc",80]);
  db.doc("settings/main").onSnapshot(function(s){ S.settings = s.exists ? s.data() : null; var b = S.sceneKey; applyMonth(); if (b !== S.sceneKey) makeDrift(); render(); }, function(){});
  watchCal();
};
})();
