<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Mon carnet</title>
<meta name="theme-color" content="#FCF6EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<style>
@font-face{font-family:Nunito;font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";font-weight:600;font-display:swap;src:url(fonts/dancing-script-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";font-weight:700;font-display:swap;src:url(fonts/dancing-script-latin-700-normal.woff2) format("woff2")}
/* Concept : un carnet aquarelle (bullet journal). Chaque mois a sa palette, son illustration de haut de page et deux illustrations peintes. Thème clair unique, assumé. */
:root{
  --paper:#FCF6EA; --dot:rgba(160,120,50,.16); --ink:#A0702A; --ink-soft:#8A6630; --band:#F8E8C6; --line:#E9D4AA; --glow:#FBE2A8; --wash:#F4D59C;
  --text:#3A2A1E; --muted:#6E5A48; --card:rgba(255,253,248,.94);
  --f-hand:"Dancing Script", "Segoe Script", cursive;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html,body{background:var(--paper);color:var(--text)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#paper{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);background-size:20px 20px}
#drift{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:2;max-width:560px;min-height:100vh;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));overflow:hidden}
.wash{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--text)}
h2{font-family:var(--f-hand);font-weight:700;font-size:38px;line-height:1;color:var(--ink)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.stk{position:absolute;pointer-events:none}

/* Écran de connexion */
#gate{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--paper);background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);background-size:20px 20px}
#gate[hidden]{display:none}
#gate h1{font-family:var(--f-hand);font-weight:700;font-size:58px;line-height:1;color:var(--ink)}
#gate p{color:var(--muted);max-width:300px}
#gate .btn-ink{min-height:50px;padding:12px 22px;font-size:16px;display:flex;align-items:center;gap:10px}
body.locked #app,body.locked nav.tabs{visibility:hidden}
.gcal-btn{margin:8px 12px 4px;display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);min-height:44px;border-radius:6px;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);font-size:14px;font-weight:800}

/* Haut de page */
.hd{position:relative;container-type:inline-size;height:min(73.4vw,411px)}
.hd-img{position:absolute;left:-5.64cqw;top:0;width:111.3cqw;max-width:none;height:62.1cqw;object-fit:cover;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
.hd-title{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.hd-title .halo{position:absolute;left:-26px;right:-26px;top:-16px;bottom:-18px;z-index:-1;border-radius:50%}
.mname{font-family:var(--f-hand);font-weight:700;line-height:1;color:var(--ink)}
.garland{display:flex;align-items:center;gap:6px;color:var(--ink);margin-top:2px}
.garland img{width:20px;height:20px}
.motto{margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.13em;line-height:1.5;text-transform:uppercase;color:var(--ink-soft)}
.hd-greet{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;padding:0 60px}
.hd-greet p{font-size:17px;font-weight:700;color:var(--text);text-align:center}
.gear{position:absolute;right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,253,248,.85);display:grid;place-items:center;color:var(--ink)}
.hd-greet .gear{bottom:-10px}
.hd.small{height:auto;padding:calc(56px + env(safe-area-inset-top,0px)) 0 6px}
.hd.small .hd-img{height:44cqw;opacity:.42;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);mask-image:linear-gradient(to bottom,#000 30%,transparent 100%)}
.hd.small .gear{top:calc(14px + env(safe-area-inset-top,0px))}
.hd-page{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.hd-page h1{font-family:var(--f-hand);font-weight:700;font-size:54px;line-height:1.05;color:var(--ink)}
.hd-page .halo{position:absolute;left:12%;right:12%;top:-18px;bottom:-14px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,var(--paper) 60%,transparent 100%)}
.hero-sub{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink-soft);margin-top:4px}

/* Mouvement */
@keyframes fall{0%{transform:translate(0,-40px) rotate(0);opacity:0}6%{opacity:.9}30%{transform:translate(-40px,30vh) rotate(140deg)}60%{transform:translate(20px,62vh) rotate(300deg)}94%{opacity:.85}100%{transform:translate(-24px,108vh) rotate(520deg);opacity:0}}
@keyframes rain{0%{transform:translate(0,-30px);opacity:0}10%{opacity:.6}100%{transform:translate(-30px,108vh);opacity:.4}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(224,64,94,.45)}100%{box-shadow:0 0 0 12px rgba(224,64,94,0)}}
@keyframes inFromRight{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFromLeft{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
html{overflow-x:hidden}
.slide-next>#hero,.slide-next>#captureZone,.slide-next>#view>:not(.fab){animation:inFromRight .26s cubic-bezier(.2,.7,.3,1)}
.slide-prev>#hero,.slide-prev>#captureZone,.slide-prev>#view>:not(.fab){animation:inFromLeft .26s cubic-bezier(.2,.7,.3,1)}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#FCF6EA;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:116px;height:116px;border-radius:28px;box-shadow:0 14px 34px rgba(150,100,60,.22)}
#splash .spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(154,106,46,.18);border-top-color:#9A6A2E;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-mic{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:#FFFDF8;color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.btn-mic[hidden]{display:none}
.btn-mic.on{background:#FCE3E8;border-color:#E0405E;color:#B02848;animation:micPulse 1.2s ease-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.4}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-4px) rotate(var(--r,0deg))}}
.faller{position:absolute;top:0;animation:fall 18s linear infinite}
.faller.raindrop{animation-name:rain;animation-timing-function:linear}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.faller,.pulse,.bob,.bar i,.slide-next>*,.slide-prev>*,.slide-next>#view>*,.slide-prev>#view>*,.btn-mic.on{animation:none!important}.faller{display:none}}

.settings-link{display:flex;justify-content:center;margin-top:18px}
.settings-link button{display:flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:0;background:transparent;color:#A69C90;font-size:13px;font-weight:700}

/* Bulles */
.bubbles-wrap{margin-top:18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bubbles-wrap::-webkit-scrollbar{display:none}
.bubbles{display:flex;gap:8px;width:max-content;padding-block:2px}
.bubble{display:flex;align-items:center;gap:6px;min-height:42px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,253,248,.85);font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.bubble .ct{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--band);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.bubble[aria-pressed="true"]{border-color:var(--ink);background:var(--band);color:var(--ink);font-weight:800}
.bubble[aria-pressed="true"] .ct{background:var(--ink);color:#FFFDF8}

/* Saisie */
.capture{position:relative;margin-top:16px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:18px;background:rgba(255,253,248,.92);border:1.5px solid var(--line);box-shadow:0 10px 24px rgba(90,60,30,.10)}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none;color:var(--text)}
.capture input::placeholder{color:#8A7A68}
.btn-add{width:44px;height:44px;border-radius:14px;border:0;background:var(--ink);display:grid;place-items:center;flex-shrink:0}
.btn-add[disabled]{opacity:.6}
.capture-hint{margin-top:8px;font-size:13px;color:var(--muted);padding-inline:6px}
.capture-hint:empty{display:none}
.capture-hint strong{color:var(--text)}

/* Cartes et sections */
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:6px;box-shadow:0 12px 28px rgba(90,60,30,.10)}
.section{position:relative;margin-top:38px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vine{color:var(--ink)}
.link-btn{border:0;background:none;padding:8px 0;font-size:14px;font-weight:800;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.soft-empty{padding:16px 18px;font-size:14px;color:var(--muted)}
.soft-empty b{color:var(--text)}
.solo>.section:first-child{margin-top:30px}

/* Briefing */
.brief-card{position:relative;margin-top:30px;padding:20px 20px 22px}
.brief-card.with-img{margin-top:84px}
.brief-head{display:flex;align-items:baseline;gap:10px}
.brief-head h2{font-size:34px}
.brief-head span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.brief{margin-top:12px;font-size:16px;line-height:1.55;color:var(--text)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--band);color:var(--ink)}
.brief-img{position:absolute;right:-14px;transform:rotate(3deg)}

/* Semaine */
.week{margin-top:12px;padding:4px 0}
.day{padding:0 12px 10px}
.dband{margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:3px 10px;border-radius:3px;background:var(--band)}
.dband span{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text);font-variant-numeric:tabular-nums}
.day.today .dband{background:var(--ink)}
.day.today .dband span{color:#FFFDF8}
.day.past .dband,.day.past .ev{opacity:.5}
.ev{display:flex;align-items:baseline;gap:8px;padding:7px 4px 0}
.ev-body{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ev-edit{align-self:center;flex-shrink:0;box-sizing:border-box;width:38px;height:38px;margin:-6px -4px -6px 0;padding:0;border:0;border-radius:10px;background:transparent;color:var(--ink-soft);display:grid;place-items:center}
.ev-edit:active{background:var(--band)}
.ev-time{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);flex-shrink:0;transform:translateY(-2px)}
.ev-t{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.ev-m{font-size:13px;color:var(--muted)}
.empty-day{display:flex;gap:6px;padding:9px 4px 0}
.empty-day i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.pill-todo{padding:4px 10px;border-radius:999px;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);font-size:12px;font-weight:800;min-height:32px}
.notice{padding:12px 14px;margin:8px 12px 4px;border-radius:4px;background:var(--band);font-size:13px;color:var(--text)}

/* Quête */
.quest{position:relative;padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px}
.quest-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.quest h3{font-size:17px;font-weight:800;margin-top:8px}
.quest h2{font-size:34px}
.quest .meta{font-size:13px;color:var(--muted);margin-top:2px}
.xp{flex-shrink:0;width:62px;height:62px;border-radius:50%;border:2px dashed var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--ink)}
.xp b{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1}
.xp span{font-size:10px;font-weight:800;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 12px;border:0;border-radius:4px;background:var(--band);text-align:left;font-size:15px;font-weight:800;color:var(--text)}
.box{width:20px;height:20px;border:2px solid var(--ink);border-radius:4px;background:#FFFDF8;flex-shrink:0;display:grid;place-items:center}
.step.done{background:transparent;color:var(--muted);text-decoration:line-through;font-weight:700}
.step.done .box{background:var(--ink)}
.later{display:flex;flex-direction:column;gap:8px}
.later div{display:flex;align-items:center;gap:12px;padding:0 12px;font-size:14px;color:var(--muted)}
.later div::before{content:"";width:16px;height:16px;border:1.5px solid var(--line);border-radius:3px;flex-shrink:0}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini{border:0;background:none;font-size:13px;font-weight:800;color:var(--muted);padding:8px 0;min-height:40px}
.qlist{display:flex;flex-direction:column;gap:22px;margin-top:12px}

/* Liens */
.frame{position:relative;margin-top:46px;padding:26px 22px 22px}
.frame>.c{position:absolute;width:34px;height:34px;border-color:var(--ink);border-style:solid;border-width:0}
.c.tl{left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}.c.tr{right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
.c.bl{left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}.c.br{right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}
.frame>h2{margin:-48px 0 0;text-align:center}
.frame>h2 span{padding:0 10px;background:var(--paper)}
.lrows{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.lrow{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--ink);flex-shrink:0}
.lrow .n{font-size:16px;font-weight:800}
.lrow .w{font-size:13px;color:var(--muted)}
.dotline{height:2px;background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:8px 2px}
.btn-line{min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:13px;font-weight:800;flex-shrink:0}
.btn-ink{min-height:44px;padding:9px 16px;border-radius:999px;border:0;background:var(--ink);color:#FFFDF8;font-size:14px;font-weight:800}

/* Anniversaires */
.bday{display:flex;align-items:center;gap:14px;padding:12px 10px 12px 14px;width:100%;box-sizing:border-box;border:0;background:transparent;text-align:left;font:inherit;color:inherit}
.bday>div{flex:1;min-width:0}
.bday .edit{margin-left:auto;flex-shrink:0;box-sizing:border-box;width:44px;height:44px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--ink-soft);display:grid;place-items:center}
.bday .edit:active{background:var(--band)}
.bday-more{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:transparent;padding:12px;font-size:14px;font-weight:800;color:var(--ink)}
.bd-date{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px}
.bd-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.bd-actions .btn{box-sizing:border-box;height:48px;min-height:0}
.bday+.bday{border-top:1px dashed var(--line)}
.bday img{width:44px;height:44px;flex-shrink:0}
.bday .n{font-size:16px;font-weight:800}
.bday .w{font-size:13px;color:var(--muted)}
.foot{position:relative;margin-top:22px;display:flex;justify-content:center}

/* Fiche */
.who{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:4px}
.avatar-big{width:96px;height:96px;border-radius:50%;background:var(--band);border:2px dashed var(--ink);display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:48px;color:var(--ink)}
.title-pill{padding:5px 14px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);font-family:var(--f-hand);font-weight:700;font-size:20px;line-height:1.2}
.lvl{padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-top:26px}
.lvl-row{display:flex;justify-content:space-between;align-items:baseline}
.lvl-row b{font-family:var(--f-hand);font-weight:700;font-size:34px;color:var(--ink)}
.lvl-row span{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--band);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background-image:linear-gradient(90deg,var(--ink),var(--wash) 25%,var(--ink) 50%,var(--wash) 75%,var(--ink));background-size:200% 100%;animation:shimmer 5s linear infinite}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;margin-top:12px}
.scol{display:flex;flex-direction:column;gap:12px}
.scol+.scol{margin-top:26px}
.stat{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:6px;border:1.5px solid transparent;text-align:left;min-width:0;box-shadow:0 10px 22px rgba(90,60,30,.10)}
.stat .top{display:flex;justify-content:space-between;align-items:center}
.stat .lv{font-family:var(--f-hand);font-size:32px;font-weight:700;line-height:1}
.stat .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.stat .nm{font-size:15px;font-weight:800}
.sbar{height:6px;border-radius:999px;background:rgba(255,255,255,.7)}
.sbar i{display:block;height:100%;border-radius:999px}
.s-force{background:#EAF2E2;border-color:#CFE0C2;color:#1F2E1C} .s-force .k,.s-force .lv{color:#3F5A3A} .s-force .sbar i{background:#5E7E56}
.s-dex{background:#FCEADB;border-color:#F2CFB2;color:#3A2416} .s-dex .k,.s-dex .lv{color:#9A5230} .s-dex .sbar i{background:#B8653C}

/* ---------- toasts, célébrations ---------- */
/* notification : monte en douceur, reste, redescend en s'effaçant ; on peut la faire glisser sur le côté pour la fermer */
var toastTimer = null, toastCur = null;
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function toastClose(t, how, dx){
  if (!t || t.closed) return; t.closed = true; clearTimeout(toastTimer);
  if (toastCur === t) toastCur = null;
  if (how !== "undo" && t.opts.after){ try { t.opts.after(); } catch(e){} }
  var el = t.el, from = el.style.transform || "none";
  var to = dx != null ? "translateX(" + (dx > 0 ? 110 : -110) + "%)" : "translateY(16px)";
  var dur = REDUCED ? 1 : (how === "replace" ? 140 : 220);
  var a = el.animate([{transform:from, opacity:getComputedStyle(el).opacity}, {transform:to, opacity:0}], {duration:dur, easing:"cubic-bezier(.4,0,1,1)", fill:"forwards"});
  a.onfinish = function(){ el.remove(); };
}
function toast(msg, opts){
  opts = opts || {};
  var root = document.getElementById("toastRoot");
  if (toastCur) toastClose(toastCur, "replace");
  var warn = /n'a pas (abouti|pu)|impossible|erreur|pas de connexion|r[ée]essaie|trop (lourde|long)|pleine|doucement/i.test(msg);
  var el = document.createElement("div"); el.className = "toast" + (warn ? " warn" : "");
  el.innerHTML = '<span class="t-ic" aria-hidden="true">' + (warn
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 6v8M12 18.5v.5"/></svg>'
      : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>')
    + '</span><p>' + h(msg) + '</p>' + (opts.undo ? '<button type="button" class="toast-undo">Annuler</button>' : "");
  root.appendChild(el);
  var t = {el:el, opts:opts, closed:false}; toastCur = t;
  if (!REDUCED) el.animate([{transform:"translateY(22px) scale(.96)", opacity:0}, {transform:"none", opacity:1}], {duration:420, easing:"cubic-bezier(.16,1,.3,1)", delay: root.children.length > 1 ? 90 : 0, fill:"backwards"});
  if (opts.undo) el.querySelector(".toast-undo").onclick = function(){ if (t.closed) return; opts.undo(); toastClose(t, "undo"); };
  var ms = opts.ms || 3200;
  toastTimer = setTimeout(function(){ toastClose(t, "time"); }, ms);
  /* glisser sur le côté pour fermer (l'action est gardée, comme si le temps était écoulé) */
  var x0 = null, dx = 0;
  el.addEventListener("pointerdown", function(e){ if (e.target.closest("button")) return; x0 = e.clientX; dx = 0; try { el.setPointerCapture(e.pointerId); } catch(er){} clearTimeout(toastTimer); el.style.transition = "none"; });
  el.addEventListener("pointermove", function(e){ if (x0 === null) return; dx = e.clientX - x0; el.style.transform = "translateX(" + dx + "px)"; el.style.opacity = String(1 - Math.min(.9, Math.abs(dx)/260)); });
  function up(){
    if (x0 === null) return; x0 = null;
    if (Math.abs(dx) > 70) return toastClose(t, "swipe", dx);
    el.style.transition = "transform .3s cubic-bezier(.16,1,.3,1), opacity .3s"; el.style.transform = ""; el.style.opacity = "";
    toastTimer = setTimeout(function(){ toastClose(t, "time"); }, 1800);
  }
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
}
function burst(x, y){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cols = ["#F2C29E","#A8C29A","#CDB9E4","#E8A889","#FFE2BC"];
  for (var i=0;i<14;i++){ var b = document.createElement("span"); b.className = "burst"; b.style.left = x + "px"; b.style.top = y + "px"; b.style.background = cols[i%5]; var a = Math.random()*Math.PI*2, r = 60 + Math.random()*90; b.style.setProperty("--dx", Math.cos(a)*r + "px"); b.style.setProperty("--dy", (Math.sin(a)*r - 40) + "px"); document.body.appendChild(b); setTimeout((function(el){ return function(){ el.remove(); }; })(b), 1200); }
}
function levelUp(title, text){
  var w = document.createElement("div"); w.className = "levelup"; w.innerHTML = '<div class="box2" role="dialog" aria-modal="true" aria-label="' + h(title) + '"><p class="eyebrow" style="color:var(--ink)">Mission accomplie</p><h2>' + h(title) + '</h2><p>' + h(text) + '</p><button type="button" class="btn green">Continuer</button></div>';
  document.body.appendChild(w); w.querySelector("button").focus(); w.onclick = function(e){ if (e.target === w || e.target.tagName === "BUTTON") w.remove(); };
  burst(window.innerWidth/2, window.innerHeight/2);
}

/* ---------- écriture ---------- */
function nowISO(){ return new Date().toISOString(); }

function award(label, stat, xp, skill){
  if (!needDb()) return Promise.resolve();
  var before = totalXP(), beforeStat = statLevel(statXP()[stat]||0), titlesBefore = unlockedTitles().length;
  return db.collection("log").add({label:label, stat:stat, xp:xp, skill:skill||null, at:nowISO()}).then(function(){
    setTimeout(function(){
      var after = totalXP();
      if (globalLevel(after) > globalLevel(before)) levelUp("Niveau " + globalLevel(after), NAME + ", tu passes niveau " + globalLevel(after) + ". Chaque petite chose faite compte.");
      else if (unlockedTitles().length > titlesBefore) levelUp(unlockedTitles()[unlockedTitles().length-1], "Nouveau titre débloqué. Il est maintenant affiché sur ta fiche.");
      else if (statLevel(statXP()[stat]||0) > beforeStat) levelUp(STATS[stat].n + " niveau " + statLevel(statXP()[stat]), "Ta caractéristique monte d'un niveau.");
    }, 700);
  }).catch(dbErr);
}

/* ---------- agenda ---------- */
function calError(e){
  var c = e && e.code;
  /* déjà synchronisé une fois : pas de bouton, l'accès se renouvelle tout seul et on garde le dernier agenda affiché */
  if (c === "needs_auth" && mcp && mcp.hasConsented && mcp.hasConsented()){ S.gcalState = "ok"; S.gcalMsg = ""; render(); return; }
  S.gcalState = c === "needs_auth" ? "auth" : "err";
  S.gcalMsg = c === "needs_auth" ? "" : c === "offline" ? "Pas de connexion : tu vois le dernier agenda enregistré." : c === "denied" ? "Accès à Google Agenda refusé." : "Google Agenda ne répond pas pour l'instant. Réessaie dans un moment.";
  render();
}
function normEvents(payload){
  var evs = (payload && payload.events) || [];
  return evs.filter(function(e){ return e.status !== "cancelled"; }).map(function(e){
    var s = e.start || {}, dt = s.dateTime || "", d = dt ? dt.slice(0,10) : (s.date || "");
    var en = e.end || {}, edt = en.dateTime || "";
    return {id:e.id, title:e.summary || "Sans titre", date:d, time: dt ? dt.slice(11,16) : null, endTime: edt ? edt.slice(11,16) : null, location:e.location || "", allDay:!dt, recurring:!!e.recurringEventId};
  });
}
var calRange = null;
function watchCal(){
  var t = today(), start = addDays(t, -7), end = addDays(t, 62);
  calRange = {start: iso(start), end: iso(end)};
  mcp.watchTool(GC, "list_events", {calendarId:CAL, startTime: iso(start) + "T00:00:00", endTime: iso(end) + "T23:59:00", orderBy:"startTime", pageSize:250}, function(ev){
    if (ev.type === "data"){ S.gcal = normEvents(ev.result && ev.result.payload); if (!ev.cached) S.gcalState = "ok"; render(); }
    else calError(ev.error);
  }, {refetchInterval: 300000});
}
function reminders(time, date, rappel){
  var r = rappel ? [0] : [20160, 10080, 1440];
  if (time && !rappel){ var p = time.split(":"), mins = (+p[0])*60 + (+p[1]||0); if (mins - 480 > 90) r.push(mins - 480); r.push(60); }
  if (date && time){
    var q = time.split(":"), start = new Date(+date.slice(0,4), +date.slice(5,7)-1, +date.slice(8,10), +q[0], +q[1]||0).getTime(), now = Date.now();
    r = r.filter(function(m){ return start - m*60000 > now + 30000; });
    if (!r.length && start > now) r = [0];
  }
  return r.map(function(m){ return {method:"popup", minutes:m}; });
}
function remindersText(r){
  var labels = {20160:"J-14",10080:"J-7",1440:"la veille",60:"1 h avant",0:"à l'heure pile"};
  var l = r.map(function(x){ return labels[x.minutes] || (x.minutes > 60 ? "le matin" : x.minutes + " min avant"); });
  if (!l.length) return "";
  return (l.length > 1 ? "Rappels " : "Rappel ") + (l.length > 1 ? l.slice(0,-1).join(", ") + " et " + l[l.length-1] : l[0]) + ".";
}
function endOf(date, time){ var p = time.split(":"); var d = new Date(+date.slice(0,4), +date.slice(5,7)-1, +date.slice(8,10), +p[0], +p[1]||0); d.setMinutes(d.getMinutes()+60); return iso(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00"; }
function createCalEvent(o){
  // o: {title, date, time|null, endTime|null, allDay, yearly}
  if (!mcp) return Promise.reject({code:"not_granted"});
  var input = {calendarId:CAL, summary:o.title};
  if (o.time){ input.startTime = o.date + "T" + o.time + ":00"; input.endTime = o.endTime ? o.date + "T" + o.endTime + ":00" : endOf(o.date, o.time); input.overrideReminders = reminders(o.time, o.date, o.reminder); }
  else { input.allDay = true; input.startTime = o.date + "T00:00:00"; input.endTime = iso(addDays(parseISO(o.date),1)) + "T00:00:00"; input.overrideReminders = [{method:"popup",minutes:19620},{method:"popup",minutes:9540},{method:"popup",minutes:300}]; }

}

/* ---------- compréhension de la phrase (100 % locale, sans IA ni connexion) ---------- */
var WD = {dimanche:0,lundi:1,mardi:2,mercredi:3,jeudi:4,vendredi:5,samedi:6};
var MOIS_N = ["janvier","fevrier","mars","avril","mai","juin","juillet","aout","septembre","octobre","novembre","decembre"];
function noAcc(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g, ""); }

(function(){

/* dictée vocale dans la barre d'ajout */
(function(){
